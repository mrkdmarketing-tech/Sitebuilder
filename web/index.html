<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>The Lab · MRKD</title>
    <!-- Apply light or dark mode before the page draws (no flash). Same rule as web/src/app/session.tsx. -->
    <script>
      (function () {
        var m = 'system';
        try { m = localStorage.getItem('mrkd.mode') || m; } catch (e) {}
        var dark = m === 'dark' || (m === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
